[package]
name = "pixel-factory-to-ota"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Convert a Pixel factory image to a full OTA"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
shlex = "1.3"
tempfile = "3.17"
thiserror = "2.0"
toml = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate", "time"] }

[build-dependencies]
prost-build = "0.14"
